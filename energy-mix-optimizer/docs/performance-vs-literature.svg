<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 440" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif">
  <style>
    .title { font-size: 16px; font-weight: 600; fill: #1a1a1a; }
    .subtitle { font-size: 12px; fill: #666; }
    .axis { stroke: #333; stroke-width: 1; }
    .grid { stroke: #e5e5e5; stroke-width: 1; stroke-dasharray: 2,3; }
    .tick-label { font-size: 11px; fill: #666; }
    .row-label { font-size: 13px; font-weight: 500; fill: #1a1a1a; }
    .row-sublabel { font-size: 10px; fill: #999; }
    .lit-range { fill: #d0d7de; }
    .project-bar { fill: #1f6feb; }
    .project-bar-bad { fill: #cf222e; }
    .project-label { font-size: 11px; font-weight: 600; fill: #1a1a1a; }
    .legend-text { font-size: 11px; fill: #1a1a1a; }
    .footer { font-size: 10px; fill: #999; font-style: italic; }
  </style>

  <!-- Title -->
  <text x="40" y="32" class="title">Day-ahead forecast NMAE: this project vs published Spanish literature</text>
  <text x="40" y="50" class="subtitle">Hold-out test set on the final 4 weeks of 2024-H1 (n=629 hourly samples).</text>

  <!-- Plot area: x 80..770, y 100..330 -->
  <!-- X axis -->
  <line x1="80" y1="330" x2="770" y2="330" class="axis"/>

  <!-- Grid + ticks every 5% (0, 5, 10, 15, 20, 25, 30) -->
  <line x1="80"  y1="100" x2="80"  y2="330" class="grid"/>
  <line x1="195" y1="100" x2="195" y2="330" class="grid"/>
  <line x1="310" y1="100" x2="310" y2="330" class="grid"/>
  <line x1="425" y1="100" x2="425" y2="330" class="grid"/>
  <line x1="540" y1="100" x2="540" y2="330" class="grid"/>
  <line x1="655" y1="100" x2="655" y2="330" class="grid"/>
  <line x1="770" y1="100" x2="770" y2="330" class="grid"/>

  <text x="80"  y="350" text-anchor="middle" class="tick-label">0%</text>
  <text x="195" y="350" text-anchor="middle" class="tick-label">5%</text>
  <text x="310" y="350" text-anchor="middle" class="tick-label">10%</text>
  <text x="425" y="350" text-anchor="middle" class="tick-label">15%</text>
  <text x="540" y="350" text-anchor="middle" class="tick-label">20%</text>
  <text x="655" y="350" text-anchor="middle" class="tick-label">25%</text>
  <text x="770" y="350" text-anchor="middle" class="tick-label">30%</text>
  <text x="425" y="374" text-anchor="middle" class="subtitle">Normalised Mean Absolute Error (NMAE, %)</text>

  <!-- DEMAND row, y center = 130 -->
  <text x="70" y="125" text-anchor="end" class="row-label">Demand</text>
  <text x="70" y="140" text-anchor="end" class="row-sublabel">MAPE shown for context</text>
  <!-- literature range 2-5% : x 80+2*23=126 to 80+5*23=195, width 69 -->
  <rect x="126" y="118" width="69" height="24" class="lit-range" rx="2"/>
  <text x="160" y="135" text-anchor="middle" class="tick-label" fill="#444">2–5% lit.</text>
  <!-- project marker at 4.75% : x = 80 + 4.75*23 = 80 + 109.25 = 189 -->
  <line x1="189" y1="110" x2="189" y2="150" stroke="#1f6feb" stroke-width="3"/>
  <circle cx="189" cy="130" r="6" class="project-bar"/>
  <text x="199" y="108" class="project-label">4.75%</text>

  <!-- SOLAR PV row, y center = 200 -->
  <text x="70" y="195" text-anchor="end" class="row-label">Solar PV</text>
  <text x="70" y="210" text-anchor="end" class="row-sublabel">NMAE</text>
  <!-- literature range 10-18% : x 80+10*23=310 to 80+18*23=494, width 184 -->
  <rect x="310" y="188" width="184" height="24" class="lit-range" rx="2"/>
  <text x="402" y="205" text-anchor="middle" class="tick-label" fill="#444">10–18% lit.</text>
  <!-- project marker at 12.67% : x = 80 + 12.67*23 = 80 + 291.41 = 371.41 -->
  <line x1="371" y1="180" x2="371" y2="220" stroke="#1f6feb" stroke-width="3"/>
  <circle cx="371" cy="200" r="6" class="project-bar"/>
  <text x="381" y="178" class="project-label">12.67%</text>

  <!-- WIND row, y center = 270 -->
  <text x="70" y="265" text-anchor="end" class="row-label">Wind</text>
  <text x="70" y="280" text-anchor="end" class="row-sublabel">NMAE</text>
  <!-- literature range 12-18% : x 80+12*23=356 to 80+18*23=494, width 138 -->
  <rect x="356" y="258" width="138" height="24" class="lit-range" rx="2"/>
  <text x="425" y="275" text-anchor="middle" class="tick-label" fill="#444">12–18% lit.</text>
  <!-- project marker at 23.68% : x = 80 + 23.68*23 = 80 + 544.64 = 624.64 -->
  <line x1="625" y1="250" x2="625" y2="290" stroke="#cf222e" stroke-width="3"/>
  <circle cx="625" cy="270" r="6" class="project-bar-bad"/>
  <text x="635" y="248" class="project-label" fill="#cf222e">23.68%</text>

  <!-- Annotation arrow for wind gap -->
  <path d="M 494 268 Q 560 240 615 263" stroke="#cf222e" stroke-width="1" fill="none" stroke-dasharray="3,3"/>
  <text x="510" y="232" class="tick-label" fill="#cf222e" font-size="10">+5–11 pp gap vs literature</text>

  <!-- Legend -->
  <rect x="80" y="395" width="20" height="10" class="lit-range" rx="2"/>
  <text x="106" y="404" class="legend-text">Published literature range (Spanish day-ahead, sophisticated models)</text>
  <circle cx="480" cy="400" r="5" class="project-bar"/>
  <text x="491" y="404" class="legend-text">This project (XGBoost + 7-point weather panel + causal lags)</text>

  <!-- Footer -->
  <text x="40" y="428" class="footer">Hold-out is the chronological last 15% of the training window; the model never sees it during fit. See README §Methodology.</text>
</svg>
